version: "3.9"

services:
  db:
    image: postgres:12-alpine
    container_name: postgres_Nexo2
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nexo-network

  backend:
    build: .
    container_name: nexo-backend
    depends_on:
      - db
    ports:
      - "8081:8081"
    networks:
      - nexo-network

networks:
  nexo-network:
    driver: bridge

volumes:
  postgres_data:
